<!doctype html>
<html><head><meta charset="utf-8">
<style>
 body{margin:0} #scroller{height:400px;overflow:auto;position:relative}
 #spacer{position:relative} .vkitAudioRow__root{position:absolute;left:0;right:0;height:40px}
</style></head><body>
<header><h1>Моя музыка</h1></header>
<div id="scroller"><div id="spacer"></div></div>
<script>
const N = 120, H = 40;
const data = Array.from({length: N}, (_, i) => ({artist: `Artist ${i + 1}`, title: `Track ${i + 1}`, d: 180 + (i % 50)}));
data[7] = {artist: "Macan", title: "ASPHALT 8", d: 150};
const scroller = document.getElementById("scroller"), spacer = document.getElementById("spacer");
spacer.style.height = N * H + "px";
function render() {
  // Виртуальный список: в DOM только видимые строки и небольшой запас.
  const first = Math.max(0, Math.floor(scroller.scrollTop / H) - 3);
  const last = Math.min(N, first + Math.ceil(400 / H) + 6);
  spacer.innerHTML = "";
  for (let i = first; i < last; i++) {
    const t = data[i], el = document.createElement("div");
    el.className = "vkitAudioRow__root vkitAudioRow__clickable";
    el.style.top = i * H + "px";
    el.innerHTML = `<div class="vkitAudioRowCover__root"></div>
      <div class="vkitAudioRowInfo__root"><span class="vkitAudioRowInfo__title">${t.title}</span>
      <span class="vkitAudioRowInfo__artists"><a href="/artist/${i}">${t.artist}</a></span></div>
      <div class="vkitAudioRowDuration__root">${Math.floor(t.d/60)}:${String(t.d%60).padStart(2,"0")}</div>`;
    spacer.appendChild(el);
  }
}
scroller.addEventListener("scroll", render);
render();
</script></body></html>
